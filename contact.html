<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Sondra Hathaway</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <a href="index.html" class="brand-link">Sondra Hathaway</a>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="index.html" class="nav-link">Home</a>
                </li>
                <li class="nav-item">
                    <a href="demos/" class="nav-link">Project Samples</a>
                </li>
                <li class="nav-item">
                    <a href="hosting.html" class="nav-link">Hosting</a>
                </li>
                <li class="nav-item">
                    <a href="websites.html" class="nav-link">Websites</a>
                </li>
                <li class="nav-item">
                    <a href="apps.html" class="nav-link">Apps</a>
                </li>
                <li class="nav-item">
                    <a href="consulting.html" class="nav-link">Consulting</a>
                </li>
                <li class="nav-item">
                    <a href="contact.html" class="nav-link active">Contact</a>
                </li>
            </ul>
            <div class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <!-- Full-screen Interactive Constellation Background -->
    <div class="constellation-background">
        <canvas id="stars-canvas"></canvas>
    </div>

    <!-- Contact Section -->
    <section id="contact" class="subscription">
        <div class="container">
            <div class="subscription-content">
                <!-- Contact Header -->
                <div class="cta-section">
                    <h2 class="section-title">Get In Touch</h2>
                    <p class="section-subtitle">Ready to discuss your project? Let's connect.</p>
                </div>

                <!-- Contact Form -->
                <div class="contact-content">
                    <div class="contact-form-container white-contact-form">
                        <form class="contact-form" id="contact-form">
                            <div class="form-group">
                                <input type="text" name="name" class="glass-input" placeholder="NAME" required>
                                <div class="error-message" id="error-name"></div>
                            </div>
                            <div class="form-group">
                                <input type="email" name="email" class="glass-input" placeholder="EMAIL" required>
                                <div class="error-message" id="error-email"></div>
                            </div>
                            <div class="form-group">
                                <input type="tel" name="phone" class="glass-input" placeholder="PHONE">
                                <div class="error-message" id="error-phone"></div>
                            </div>
                            <div class="form-group">
                                <textarea name="message" class="glass-textarea" placeholder="MESSAGE" rows="5" required></textarea>
                                <div class="error-message" id="error-message"></div>
                            </div>
                            <button type="submit" class="btn btn-primary btn-full">Send Message</button>
                            <div class="form-status" id="form-status"></div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-text">
                    <p>&copy; 2025 Sondra Hathaway. All rights reserved.</p>
                </div>
                <div class="social-links">
                    <a href="https://www.linkedin.com/in/sondrahathaway/" target="_blank" rel="noopener noreferrer"
                        class="social-link">LinkedIn</a>
                    <a href="https://github.com/sondhath-cloud" target="_blank" rel="noopener noreferrer"
                        class="social-link">GitHub</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
