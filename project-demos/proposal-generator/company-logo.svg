<svg width="200" height="80" viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285f4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34a853;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="40" cy="40" r="35" fill="url(#logoGradient)" opacity="0.1"/>
  
  <!-- Main icon -->
  <rect x="25" y="25" width="30" height="30" rx="6" fill="url(#logoGradient)"/>
  
  <!-- Inner elements -->
  <rect x="30" y="30" width="8" height="8" rx="2" fill="white" opacity="0.9"/>
  <rect x="42" y="30" width="8" height="8" rx="2" fill="white" opacity="0.9"/>
  <rect x="30" y="42" width="8" height="8" rx="2" fill="white" opacity="0.9"/>
  <rect x="42" y="42" width="8" height="8" rx="2" fill="white" opacity="0.9"/>
  
  <!-- Company name -->
  <text x="90" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#202124">DemoCorp</text>
  <text x="90" y="55" font-family="Arial, sans-serif" font-size="12" fill="#5f6368">Business Solutions</text>
</svg>
